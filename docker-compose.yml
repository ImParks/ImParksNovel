services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe_dev_2026
      POSTGRES_DB: vibe_coding
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibe -d vibe_coding']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vibe-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: vibe-elasticsearch
    restart: unless-stopped
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    container_name: vibe-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vibe:vibe_dev_2026@postgres:5432/vibe_coding?schema=public
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-test_ck_placeholder}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test_sk_placeholder}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
    command: sh -c "pnpm --filter api prisma:generate && (pnpm --filter api prisma migrate deploy || echo 'No migrations to apply') && pnpm --filter api dev"

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    container_name: vibe-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000/graphql
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: 3000
    command: pnpm --filter web dev

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
