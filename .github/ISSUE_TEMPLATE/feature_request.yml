name: Feature Request
description: 새로운 기능을 제안합니다
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안을 작성해 주셔서 감사합니다.
  - type: dropdown
    id: package
    attributes:
      label: 패키지
      description: 기능이 추가될 패키지를 선택하세요
      options:
        - web (Next.js 프론트엔드)
        - api (NestJS 백엔드)
        - shared (공유 패키지)
        - infra (인프라)
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      description: 관련 도메인을 선택하세요
      options:
        - auth (인증/인가)
        - novel (소설)
        - episode (에피소드)
        - payment (결제)
        - ai (AI 기능)
        - search (검색)
        - 기타
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 이 기능이 해결하는 문제를 설명해 주세요
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 기능을 상세히 설명해 주세요
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려한 다른 방법이 있다면 설명해 주세요
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 기능에 대한 추가 정보나 스크린샷을 첨부해 주세요
    validations:
      required: false
