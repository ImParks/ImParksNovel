name: Bug Report
description: 버그를 신고합니다
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        버그 리포트를 작성해 주셔서 감사합니다.
  - type: dropdown
    id: package
    attributes:
      label: 패키지
      description: 버그가 발생한 패키지를 선택하세요
      options:
        - web (Next.js 프론트엔드)
        - api (NestJS 백엔드)
        - shared (공유 패키지)
        - infra (인프라)
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      description: 관련 도메인을 선택하세요
      options:
        - auth (인증/인가)
        - novel (소설)
        - episode (에피소드)
        - payment (결제)
        - ai (AI 기능)
        - search (검색)
        - 기타
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 버그에 대해 명확하게 설명해 주세요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 버그를 재현할 수 있는 단계를 작성해 주세요
      value: |
        1. '...'로 이동
        2. '...'를 클릭
        3. '...'까지 스크롤
        4. 오류 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 어떻게 동작해야 하는지 설명해 주세요
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떻게 동작하는지 설명해 주세요
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷
      description: 해당되는 경우 스크린샷을 추가해 주세요
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 환경 정보
      description: 브라우저, OS 등 환경 정보를 작성해 주세요
      value: |
        - OS:
        - 브라우저:
        - 버전:
    validations:
      required: false
