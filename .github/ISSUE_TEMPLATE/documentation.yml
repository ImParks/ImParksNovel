name: Documentation
description: 문서 추가 또는 수정을 요청합니다
title: "[Docs] "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        문서 관련 요청을 작성해 주셔서 감사합니다.
  - type: dropdown
    id: type
    attributes:
      label: 문서 유형
      description: 문서 작업의 유형을 선택하세요
      options:
        - 신규 작성
        - 수정/업데이트
        - 오류 수정
        - 번역
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 관련 패키지
      description: 관련된 패키지를 선택하세요
      options:
        - web (Next.js 프론트엔드)
        - api (NestJS 백엔드)
        - shared (공유 패키지)
        - infra (인프라)
        - root (프로젝트 전체)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 어떤 문서가 필요하거나 수정이 필요한지 설명해 주세요
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 문서 위치
      description: 관련 문서의 파일 경로 또는 URL (수정 요청인 경우)
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고 자료나 추가 정보를 첨부해 주세요
    validations:
      required: false
